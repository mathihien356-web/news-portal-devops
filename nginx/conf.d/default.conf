# ==============================================================================
# ĐỊNH TUYẾN REVERSE PROXY, HTTPS VÀ CẤU HÌNH BẢO MẬT NGINX
# Sinh viên: Ma Thị Hiền (MSSV: DTC245200948)
# ==============================================================================

# 1. Chuyển hướng bắt buộc toàn bộ lưu lượng HTTP (Cổng 80) sang HTTPS (Cổng 443)
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Máy chủ an toàn mã hóa SSL/TLS (Cổng 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    # Đường dẫn chứng chỉ số RSA 2048-bit tự ký
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # BẢO MẬT SSL/TLS: Chỉ chấp nhận TLSv1.2 và TLSv1.3 (Từ chối TLSv1.0 và TLSv1.1 lỗi thời)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # BỘ BẢO MẬT SECURITY HEADERS TIÊU CHUẨN (Áp dụng always cho mọi phản hồi)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data:; font-src 'self' https: data:;" always;

    # Proxy buffer tối ưu
    proxy_buffers 16 16k;
    proxy_buffer_size 16k;

    # BẢO MẬT: Giới hạn tần suất đăng nhập chống Brute-force trên trang login
    # Trả về HTTP 429 khi người dùng hoặc kẻ tấn công gửi quá nhiều yêu cầu trong thời gian ngắn
    location = /login.php {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass http://webapp:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Định tuyến mặc định tới Ứng dụng Web Tin Tức
    location / {
        proxy_pass http://webapp:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Định tuyến an toàn tới phpMyAdmin
    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Định tuyến an toàn tới Grafana Dashboards (Hỗ trợ WebSocket)
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint giám sát trạng thái kết nối Nginx cho Nginx Prometheus Exporter
    # Chỉ cho phép truy cập từ localhost và mạng nội bộ Docker, từ chối toàn bộ từ internet
    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
