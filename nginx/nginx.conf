user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Cấu hình temp path cho môi trường container bảo mật chạy non-root/read-only
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Định dạng nhật ký chi tiết phục vụ Promtail dán nhãn job="nginx"
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Tối ưu hóa truyền tải mạng
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # BẢO MẬT: Ẩn phiên bản máy chủ Nginx trong Header phản hồi
    server_tokens off;

    # BẢO MẬT: Giới hạn tần suất đăng nhập chống tấn công Brute-Force (Rate Limiting)
    # Vùng nhớ 10MB lưu trữ ~160.000 địa chỉ IP, tốc độ tối đa 5 yêu cầu/phút
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_status 429;

    # Nén Gzip tăng tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype image/svg+xml;

    # Nạp cấu hình các virtual hosts
    include /etc/nginx/conf.d/*.conf;
}
